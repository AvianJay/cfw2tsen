# cfw2tsen — split deployment.
#
# Two containers on a private bridge network. This is the layout to use when the
# all-in-one container cannot be given the capabilities it needs, or when you
# want the WARP gateway to serve other workloads as well.
#
#   docker compose -f docker-compose.split.yml up -d
#
# Topology:
#
#   warp-gateway (10.1.0.2)                exit-node
#   ┌──────────────────────┐              ┌──────────────────────────┐
#   │ WARP + NAT + MSS     │◄─────────────│ tailscaled exit node     │
#   │ masquerades to tun   │  10.1.0.0/29 │ default route -> 10.1.0.2│
#   └──────────────────────┘              └──────────────────────────┘
#
# The exit node's default route is repointed at the gateway, so all forwarded
# tailnet traffic leaves through WARP.

networks:
  warpnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.0.0/29
          gateway: 10.1.0.1

services:
  warp-gateway:
    build:
      context: .
    image: ghcr.io/AvianJay/cfw2tsen:latest
    container_name: cfw2tsen-warp
    hostname: warp-gateway
    # No SYS_ADMIN here: this role does not create a network namespace, so
    # NET_ADMIN is sufficient for the tunnel and its nftables rules.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      MODE: warp-only
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WARP_ENABLE: 1
      WARP_MODE: warp
      # No isolation needed here: Tailscale does not run in this container.
      WARP_NETNS: ""
      WARP_ENABLE_NAT: 1
      # WARP_ORG: your-team
      # WARP_AUTH_CLIENT_ID: ${WARP_AUTH_CLIENT_ID}
      # WARP_AUTH_CLIENT_SECRET: ${WARP_AUTH_CLIENT_SECRET}
      # WARP_LICENSE_KEY: ${WARP_LICENSE_KEY}
    networks:
      warpnet:
        ipv4_address: 10.1.0.2
    volumes:
      - warp-state:/var/lib/cloudflare-warp
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  exit-node:
    build:
      context: .
    image: ghcr.io/AvianJay/cfw2tsen:latest
    container_name: cfw2tsen-exit
    hostname: cfw2tsen-exit-node
    depends_on:
      warp-gateway:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    environment:
      MODE: tailscale-only
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Repoint the default route at the WARP gateway.
      WARP_GATEWAY: 10.1.0.2
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-cfw2tsen-exit-node}
      TS_ADVERTISE_EXIT_NODE: 1
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_AUTH_ONCE: "true"
      # TS_DEVICE_IP: 100.64.0.10
      # TS_API_KEY: ${TS_API_KEY}
    networks:
      warpnet:
        ipv4_address: 10.1.0.3
    volumes:
      - tailscale-state:/var/lib/tailscale
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  tailscale-state:
  warp-state:
